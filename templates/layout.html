<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI Blog App</title>
    <!-- Tailwind CSS Output File Link -->
    <link href="{{ url_for('static', path='dist/output.css') }}" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 antialiased font-sans">

    <!-- Simple Modern Navbar -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0">
                    <a href="/" class="text-2xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">
                        DevBlog
                    </a>
                </div>
                <div class="flex space-x-4">
                    <a href="/" class="text-slate-600 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium transition">Home</a>
                    <a href="#" class="text-slate-600 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium transition">New Post</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        {% block content %}
        <!-- Dynamic content will inject here -->
        {% endblock %}
    </main>

    <!-- Simple Footer -->
    <footer class="border-t border-slate-200 bg-white py-6 mt-auto">
        <div class="max-w-5xl mx-auto text-center text-sm text-slate-400">
            &copy; 2026 DevBlog. Built with FastAPI & Tailwind.
        </div>
    </footer>

</body>
</html>
